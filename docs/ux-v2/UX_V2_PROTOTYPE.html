<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">OB</div><div><div class="brand-name">Optimization Brain</div><div class="brand-sub">Decision Intelligence Studio</div></div></div>
  <div class="toolbar">
    <span class="chip demo-chip">◆ Prototype autonome</span>
    <select id="orgsel" class="selector" aria-label="Organisation"><option value="factory">Usine fictive</option><option value="university">Université fictive</option></select>
    <select id="rolesel" class="selector" aria-label="Rôle fictif de démonstration"><option value="ADMIN">Administrateur · démo</option><option value="VIEWER">Lecteur · démo</option></select>
    <button id="modebtn" class="btn smallbtn" type="button">⚙ Mode expert : OFF</button>
  </div>
</header>
<aside class="sidebar" aria-label="Navigation principale"><span class="sidetitle">ESPACE DE DÉCISION</span>
  <button class="navbtn active" data-page="dashboard"><span class="navico">▦</span>Tableau de bord</button>
  <button class="navbtn" data-page="organization"><span class="navico">◇</span>Mon organisation</button>
  <button class="navbtn" data-page="optimization"><span class="navico">▷</span>Optimisation</button>
  <button class="navbtn" data-page="scenarios"><span class="navico">⇄</span>Scenario Lab</button>
  <button class="navbtn" data-page="history"><span class="navico">▤</span>Décisions & historique</button>
  <div class="sidesection">OUTILS D'INTERFACE</div>
  <label style="font-size:11px;margin:0 8px;color:#cbd8e3;display:grid;gap:6px">Simuler un état
    <select id="statesel" class="selector" style="width:100%;max-width:none"><option value="normal">Données disponibles</option><option value="loading">Chargement</option><option value="empty">Aucune donnée</option><option value="error">Erreur de connexion</option><option value="forbidden">Accès limité</option></select>
  </label>
  <div class="sidebottom"><strong>Une organisation. Des décisions vérifiables.</strong><br/>Les résultats présentés sont des références synthétiques documentées.<br/><br/>Aucun appel réseau ni calcul réel.</div>
</aside>
<main id="main" class="main" tabindex="-1"></main>
<nav class="mobile-nav" aria-label="Navigation mobile"><button data-page="dashboard"><span>▦</span>Accueil</button><button data-page="organization"><span>◇</span>Organisation</button><button data-page="optimization"><span>▷</span>Calcul</button><button data-page="scenarios"><span>⇄</span>Scénarios</button><button data-page="history"><span>▤</span>Historique</button></nav>
</div>
<script>
(function(){
 const state={page:'dashboard',org:'factory',role:'ADMIN',expert:false,sim:'normal',selectedNode:'logistics',wizard:1,scenarioValue:45,preview:false,jobState:0,selectedResult:'factory',graphView:'business'};
 const factory={name:'Usine fictive',metric:'4 100 €',label:'Contribution du plan',qualification:'Optimal selon les tolérances du solveur',decisions:'Produit A : 40 · Produit B : 15',resources:[{name:'Logistique',used:55,total:55,unit:'unités'},{name:'Machines',used:95,total:100,unit:'h'},{name:'Budget',used:7000,total:8000,unit:'€'}]};
 const university={name:'Université fictive',metric:'17',label:'Score du plan',qualification:'Optimal selon les tolérances du solveur',decisions:'Mathématiques et sciences sélectionnées',resources:[{name:'Budget',used:9,total:9,unit:'€'},{name:'Salles',used:2,total:2,unit:'salles'}]};
 const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const elem=document.getElementById('main');
 const d=()=>state.org==='factory'?factory:university;
 const fmt=(n)=>Number(n).toLocaleString('fr-FR');
 const header=(section,title,desc,actions='')=>`<div class="eyebrow">${section} / ${esc(d().name)}</div><div class="heading"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`;
 const button=(label,action='')=>`<button class="btn" data-action="${action}">${label}</button>`;
 const expert=(html)=>state.expert?`<section class="expert"><h3>◈ Informations du mode expert</h3>${html}</section>`:'';
 const resourceRows=()=>d().resources.map(r=>`<div class="progress-row"><div class="progress-header"><span>${esc(r.name)}</span><strong>${fmt(r.used)} / ${fmt(r.total)} ${esc(r.unit)}</strong></div><div class="progress"><div class="fill ${r.used===r.total?'warn':''}" style="width:${100*r.used/r.total}%"></div></div><div class="hint">${r.used===r.total?'Capacité entièrement utilisée dans ce plan':'Capacité restante : '+fmt(r.total-r.used)+' '+esc(r.unit)}</div></div>`).join('');
 function dashboard(){let x=d();const fac=state.org==='factory';return header('Accueil','Pilotez vos décisions avec confiance','Comprenez les résultats vérifiés, les ressources utilisées et les prochaines actions possibles.',`<button class="btn primary" data-goto="optimization">▷ Lancer une optimisation</button>`)+`
 <div class="cards">
   <article class="card metric"><div class="metric-label">${x.label}</div><div class="metric-value">${x.metric}</div><div class="metric-hint">Référence synthétique vérifiée</div></article>
   <article class="card metric"><div class="metric-label">Statut mathématique</div><div style="margin-top:18px"><span class="tag">✓ Optimal*</span></div><div class="metric-hint" style="margin-top:16px">* Aux tolérances enregistrées</div></article>
   <article class="card metric"><div class="metric-label">Décisions du plan</div><div style="margin:17px 0 10px;font-size:17px;font-weight:800;color:var(--navy)">${fac?'40 unités A · 15 unités B':'Maths + sciences'}</div><div class="metric-hint">Plan vérifié indépendamment</div></article>
   <article class="card metric"><div class="metric-label">Nature des données</div><div style="margin-top:18px"><span class="tag neutral">Démo</span></div><div class="metric-hint" style="margin-top:16px">Aucune donnée opérationnelle réelle</div></article>
 </div>
 <div class="two section">
 <section class="card panel"><div class="sectop"><h2>Capacités et utilisation</h2><span class="tag neutral">Dernier plan de référence</span></div>${resourceRows()}<button class="btn smallbtn" data-goto="organization">Explorer les ressources →</button></section>
 <section class="card panel"><div class="sectop"><h2>À examiner</h2><span class="tag warn">Point d'attention</span></div><div class="insight"><div class="insight-icon">◎</div><div><h3>${fac?'Logistique totalement utilisée':'Budget et salles totalement utilisés'}</h3><p>La saturation est observée dans le plan de référence. Elle ne démontre pas à elle seule la valeur économique d'une ressource supplémentaire.</p></div></div><div class="divider"></div><div class="overline" style="margin-bottom:13px">Étapes suivantes</div><ul class="feature-list"><li><span class="dot"></span>Consulter les décisions vérifiées et leurs unités.</li><li><span class="dot"></span>Explorer un changement d'hypothèse explicitement autorisé.</li><li><span class="dot"></span>Faire valider les modifications avant tout nouveau calcul.</li></ul><div class="actions" style="margin-top:25px"><button class="btn primary" data-goto="history">Voir le résultat →</button><button class="btn" data-goto="scenarios">Explorer les scénarios</button></div></section></div>
 ${expert('<p>Les affichages utilisent des exemples documentés du noyau et du projet. Pour une plateforme connectée, les champs de version du modèle, les hashes de snapshots, les tolérances et les identifiants exacts doivent être fournis par l’API ; cette maquette ne les invente pas.</p>')}`}
 function organization(){let fac=state.org==='factory',resources=fac?[['finance','Finance','finance_resource','8 000 €'],['logistics','Logistique','logistics_resource','55 unités'],['production','Production','production_resource','100 h'],['sales','Ventes',null,null]]:[['teaching','Enseignement',null,null]];const meta={finance:['Budget financier','8 000 €','7 000 €','Finance'],logistics:['Capacité logistique','55 unités','55 unités','Logistique'],production:['Capacité machines','100 h','95 h','Production'],sales:['Département commercial','—','—','Ventes'],teaching:['Organisation universitaire','—','—','Enseignement']};let sel=meta[state.selectedNode]||meta[fac?'logistics':'teaching'];if(!fac)return header('Organisation','Comprendre votre organisation','Le détail du graphe universitaire doit être chargé depuis la source de vérité. Cette maquette n’invente pas des relations entre départements.')+`<section class="card panel"><div class="empty-state"><h2>Carte universitaire : données organisationnelles non embarquées</h2><p>Le cas universitaire de référence permet de vérifier un score 17, 9/9 € de budget et 2/2 salles, mais la structure de ses départements n’est pas reproduite dans cette maquette.</p><button class="btn primary" data-goto="dashboard">Retour au tableau de bord</button></div></section>`;return header('Organisation','Comprendre votre organisation','Une représentation métier des départements et ressources, sans confondre les liens déclarés et les contraintes mathématiques.',`<button class="btn" data-goto="dashboard">← Retour au tableau de bord</button>`)+`
 <div class="card panel"><div class="sectop"><h2>Carte organisationnelle</h2><div class="tabs"><button class="tab ${state.graphView==='business'?'active':''}" data-graph="business">Vue métier</button><button class="tab ${state.graphView==='expert'?'active':''}" data-graph="expert">Graphe technique</button></div></div>
 <div class="graph-layout"><div class="diagram"><div class="overline" style="margin-bottom:16px">DÉPARTEMENTS <span style="float:right">RESSOURCES DÉCLARÉES</span></div><div class="graphgrid">${resources.map(([id,name,res,capacity])=>`<button class="graphnode ${state.selectedNode===id?'selected':''}" data-node="${id}"><small>DÉPARTEMENT</small><strong>${name}</strong></button><div class="connector ${!res?'mutedline':''}" ${!res?'style="opacity:.15"':''}></div>${res?`<button class="graphnode resource ${state.selectedNode===id?'selected':''}" data-node="${id}"><small>RESSOURCE</small><strong>${esc(res)}</strong><small>${capacity}</small></button>`:'<div style="font-size:11px;color:#8094a4;padding-left:12px">Relation informative avec la production</div>'}`).join('')}</div><div class="page-note">◉ Les relations sont descriptives. Les équations proviennent du modèle compilé.</div></div>
 <aside class="inspector"><div class="overline">INSPECTEUR CONTEXTUEL</div><h2 style="margin:13px 0 8px;font-size:21px">${sel[0]}</h2><p class="muted">Sélectionnez un nœud pour comprendre son rôle et les chiffres disponibles.</p><div class="kv"><span>Département</span><strong>${sel[3]}</strong></div><div class="kv"><span>Capacité déclarée</span><strong>${sel[1]}</strong></div><div class="kv"><span>Utilisation vérifiée</span><strong>${sel[2]}</strong></div><div class="divider"></div><span class="tag neutral">Vue informative</span><p class="notice-small">L'usage réel dépend du dernier résultat enregistré. Une arête graphique ne calcule pas de consommation.</p></aside></div>
 ${state.graphView==='expert'?'<div class="callout" style="margin-top:15px"><strong>Graphe technique</strong>Afficher ici les identifiants, relations typées, versions et références de ressources provenant du snapshot réel. La maquette ne prétend pas être un éditeur de graphe connecté.</div>':''}
 </div>${expert('<p>Éléments avancés prévus : propriétés de nœuds, versions de graphes, provenance déclarée, contraintes effectivement compilées et export JSON dans un panneau secondaire. Aucune donnée de provenance fictive n’est générée.</p>')}`}
 function optimization(){const s=state.jobState;return header('Optimisation','Exécuter un problème publié','Choisissez une version validée et comprenez exactement ce qui sera exécuté. La simulation ci-dessous n’appelle aucun solveur.',`<button class="btn" data-goto="history">Consulter les décisions</button>`)+`
 <div class="two"><section class="card panel"><div class="sectop"><h2>Préparer une optimisation</h2><span class="tag">Modèle publié · démo</span></div><div class="formgrid"><label class="field">Problème à résoudre<select disabled><option>${state.org==='factory'?'Plan de production usine':'Choix d’enseignements université'}</option></select><small>Référence synthétique documentée.</small></label><label class="field">Mode de résolution<select disabled><option>Optimisation mathématique · HiGHS</option></select><small>La véritable exécution est assurée par le worker existant.</small></label></div><div class="callout" style="margin-top:19px"><strong>Vos décisions restent sous contrôle</strong>Une optimisation ne modifie ni les contraintes HARD ni le modèle publié. Seuls les runs réels et vérifiés peuvent être présentés comme résultats.</div><div class="divider"></div><div class="actions"><button class="btn primary" data-action="simulate-job" ${state.role==='VIEWER'?'disabled title="Action réservée au rôle autorisé"':''}>▷ Montrer les états d'un job</button><span class="muted">Simulation UX, pas d'exécution backend</span></div></section>
 <section class="card panel"><div class="sectop"><h2>Suivi d'exécution</h2><span class="tag ${s===1||s===2?'warn':'neutral'}">${['Prêt','En file','En cours','Terminé (simulation)'][s]}</span></div><div class="status-chain">${['Préparé','En file','Calcul','Consultation'].map((name,i)=>`<div class="status-step ${s>=i?(s===i?'active':'passed'):''}"><div class="status-marker">${s>i?'✓':i+1}</div>${name}</div>`).join('')}</div><p class="muted">${s===0?'Aucun job lancé dans cette maquette. Utilisez la démonstration pour observer les états.':s<3?'Étape simulée. Aucun progrès chiffré ni résultat mathématique n’est calculé.':'Fin du parcours d’interface simulé. Consultez séparément les résultats documentés.'}</p><div class="actions" style="margin-top:26px"><button class="btn" data-action="next-job" ${s===0||s===3?'disabled':''}>Étape suivante →</button><button class="btn" data-action="reset-job">Réinitialiser</button></div></section></div>
 <section class="card panel section"><div class="sectop"><h2>Comment lire les statuts</h2></div><div class="twoequal"><div class="callout"><strong>État technique</strong>QUEUED, RUNNING, SUCCEEDED, FAILED et CANCELLED décrivent le cycle du job, pas la qualité mathématique du résultat.</div><div class="callout orange"><strong>Statut mathématique</strong>OPTIMAL, INFEASIBLE et TIME_LIMIT doivent conserver leur signification. SUCCEEDED ne veut pas dire OPTIMAL.</div></div></section>${expert('<p>En mode expert : modèle et snapshot, options SolveSettings, idempotence, limites, vérification et raison de terminaison. Aucun identifiant de job fictif ne sera présenté comme artefact réel.</p>')}`}
 function scenarios(){const stage=state.wizard;const fac=state.org==='factory';return header('Scenario Lab','Explorer un changement autorisé','Un parcours guidé de prévisualisation, approbation et publication. Les calculs réels restent exécutés par le backend.',`<button class="btn" data-goto="history">Historique des plans</button>`)+`
 <section class="card panel"><div class="stepper">${['Référence','Politique publiée','Hypothèse','Prévisualisation','Publication'].map((t,i)=>`<span class="stepchip ${stage===i+1?'current':stage>i+1?'finished':''}">${i+1}. ${t}</span>`).join('')}</div>
 ${stage===1?`<h2 style="margin:0 0 10px">1. Choisir le modèle de référence</h2><p class="muted">Une version publiée est obligatoire. La référence ne sera pas modifiée.</p><div class="pillrow"><div><strong>${fac?'Plan industriel de référence':'Plan universitaire de référence'}</strong><div class="hint">${fac?'Objectif : 4 100 €':'Score : 17'} · Plan de démonstration vérifié</div></div><span class="tag">Publié</span></div><div class="callout" style="margin-top:18px">Dans le produit réel, la référence devra être chargée depuis l'API et présentée avec son identifiant de version vérifié.</div>`:''}
 ${stage===2?`<h2 style="margin:0 0 10px">2. Vérifier la politique publiée</h2><p class="muted">Le responsable doit avoir donné son accord et un ADMIN ou APPROVER doit avoir publié la politique avant toute prévisualisation de scénario.</p><div class="pillrow"><div><strong>Politique de changement numérique</strong><div class="hint">Règles SET, unité, plage, responsables et délégations vérifiés côté serveur</div></div><span class="tag neutral">Statut réel requis</span></div><div class="callout orange" style="margin-top:18px"><strong>Pas d'autorisation inventée</strong>Les états d'accord et de publication ne sont pas fournis par une API dans ce prototype. Ils doivent être contrôlés dans l'application réelle avant de poursuivre.</div>`:''}
 ${stage===3?`<h2 style="margin:0 0 10px">3. Définir une hypothèse</h2><p class="muted">Exemple pédagogique d'une modification numérique. Dans l'application, seul un acteur explicitement délégué et une politique utilisable peuvent poursuivre.</p><div class="twoequal"><label class="field">Paramètre ciblé<input disabled value="${fac?'Capacité logistique':'Capacité de salle'}"/><small>Cible autorisée à confirmer côté serveur.</small></label><label class="field">Valeur de scénario<input id="scenario-input" type="number" step="1" min="1" max="1000" value="${fac?state.scenarioValue:1}" ${!fac?'disabled':''}/><small>${fac?'Exemple : 45 unités ; valeur de référence 55 unités':'Exemple vérifié : 1 salle ; référence 2 salles'}</small></label></div><div class="callout orange" style="margin-top:18px"><strong>Attention</strong>Les bornes et délégations réelles viennent d'une politique publiée et doivent être validées par le serveur. Cette maquette ne constitue pas une autorisation.</div>`:''}
 ${stage===4?`<h2 style="margin:0 0 10px">4. Prévisualiser avant enregistrement</h2><p class="muted">Cette étape illustre le diff et la provenance. Elle ne calcule pas la nouvelle solution.</p><div class="scenario-value"><div style="text-align:center"><div class="overline">Référence</div><strong>${fac?'55 unités':'2 salles'}</strong></div><div class="arrow">→</div><div style="text-align:center"><div class="overline">Hypothèse</div><strong>${fac?state.scenarioValue+' unités':'1 salle'}</strong></div></div><div class="callout" style="margin-top:16px"><strong>Prévisualisation métier</strong>La plateforme doit identifier les paramètres et contraintes touchés à partir du rapport réel, puis exiger une validation explicite. Aucun objectif futur n'est anticipé ici.</div>`:''}
 ${stage===5?`<h2 style="margin:0 0 10px">5. Créer puis publier les artefacts</h2><p class="muted">La politique est censée être publiée avant ce stade. L'application réelle confirme la création, puis publie les artefacts après autorisation.</p><div class="pillrow" style="margin-top:10px"><div><strong>Publication du graphe puis du modèle</strong><div class="hint">Deux opérations explicites, sans publication automatique</div></div><span class="tag neutral">À confirmer</span></div><div class="divider"></div><div class="callout orange"><strong>Résultat d'exemple documenté</strong>${fac?state.scenarioValue===45?'Une exécution vérifiée du scénario logistique à 45 unités a donné 3 500 € dans les tests.':state.scenarioValue===55?'La référence de 55 unités vaut 4 100 €.':'Aucun résultat documenté pour cette valeur dans la maquette.':'Un scénario de capacité 1 salle a produit un score 10 dans les tests.'} Il ne s'agit pas d'un gain calculé par l'application.</div>`:''}
 <div class="scenarios-actions"><button class="btn" data-action="prev-scenario" ${stage===1?'disabled':''}>← Précédent</button><button class="btn primary" data-action="next-scenario" ${stage===5||state.role==='VIEWER'?'disabled':''}>${stage===4?'Voir la publication':'Continuer →'}</button></div></section>
 <section class="card panel section"><div class="sectop"><h2>Ce que le produit autorise réellement</h2><span class="tag neutral">Phase 5B-2</span></div><ul class="feature-list"><li><span class="dot"></span>Changement numérique SET sous politique versionnée et publiée.</li><li><span class="dot"></span>Accords des responsables et délégation explicite de l'exécutant.</li><li><span class="dot"></span>Nouveau graphe et modèle en brouillon, puis publications distinctes.</li><li><span class="dot"></span>Optimisation et vérification indépendantes via le worker existant.</li></ul><p class="notice-small">Comparaison de scénarios et calcul de gains : non disponibles à ce stade.</p></section>${expert('<p>Les identités de politique, les hashes de preview, les autorisations, les paramètres du compositeur et les snapshots devront rester auditables, mais pas être requis dans le parcours métier standard.</p>')}`}
 function history(){let fac=state.org==='factory';let rows=fac?[{id:'factory',name:'Plan de référence usine',value:'4 100 €',desc:'A = 40, B = 15',kind:'Référence documentée'},{id:'factory45',name:'Capacité logistique : 45',value:'3 500 €',desc:'Scénario de test vérifié',kind:'Hypothèse contrôlée'}]:[{id:'univ',name:'Plan universitaire de référence',value:'17',desc:'Mathématiques + sciences',kind:'Référence documentée'},{id:'univ1',name:'Capacité de salle : 1',value:'10',desc:'Scénario de test vérifié',kind:'Hypothèse contrôlée'}];let selected=rows.find(x=>x.id===state.selectedResult)||rows[0];return header('Historique','Décisions & résultats vérifiés','Retrouvez ce qui a été effectivement calculé, le statut mathématique et les preuves associées.',`<button class="btn" data-goto="optimization">+ Nouvelle optimisation</button>`)+`
 <section class="card panel"><div class="sectop"><h2>Exemples de résultats documentés</h2><span class="tag neutral">Données synthétiques</span></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Scénario</th><th>Statut de référence</th><th>Valeur</th><th>Nature</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${r.name}</strong><br/><span class="hint">${r.desc}</span></td><td><span class="tag">Plan vérifié</span></td><td><strong>${r.value}</strong></td><td>${r.kind}</td><td><button data-result="${r.id}">Consulter</button></td></tr>`).join('')}</tbody></table></div><div class="page-note">Les résultats présentés sont issus de tests documentés, pas d'un historique connecté dans cette maquette.</div></section>
 <div class="two section"><section class="card panel"><div class="sectop"><h2>Lecture du résultat</h2><span class="tag">Plan vérifié</span></div><div class="metric-label">${selected.name}</div><div class="metric-value">${selected.value}</div><p class="muted">${selected.desc}. La preuve d'optimalité dépend du statut et des tolérances du run réel ; l'existence d'un plan vérifié ne garantit pas seule l'optimalité.</p>${selected.id==='factory'?`<div class="divider"></div>${resourceRows()}`:''}</section><section class="card panel"><div class="sectop"><h2>Ce que signifie « vérifié »</h2></div><ul class="feature-list"><li><span class="dot"></span>Les bornes et domaines du plan sont contrôlés.</li><li><span class="dot"></span>Les contraintes sont réévaluées indépendamment.</li><li><span class="dot"></span>L'objectif est recalculé et comparé au solveur.</li><li><span class="dot"></span>Les tolérances et limites doivent rester explicites.</li></ul><div class="divider"></div><div class="callout orange"><strong>Aucun gain non justifié</strong>Comparer les valeurs de modèles sous des hypothèses différentes n'est pas nécessairement un gain opérationnel. La fonctionnalité de comparaison rigoureuse appartient à la phase 5B-3.</div></section></div>${expert('<p>À l’ouverture d’un vrai run, montrer ici les identifiants réels, le hash de modèle, la version du solveur, le rapport de validation, les résidus, les bornes et le document original dans une vue secondaire. Aucune empreinte fictive ne remplace l’artefact API.</p>')}`}
 function statusOverride(){const p=state.page;if(state.sim==='normal')return null;if(state.sim==='loading')return header('États UX','Chargement des données','Exemple d’état de chargement limité à la page.')+`<section class="card panel"><div class="skeleton" style="width:34%"></div><div class="skeleton" style="width:78%"></div><div class="skeleton" style="width:57%"></div><p class="muted">Chargement de ${p==='dashboard'?'la synthèse':'la section'}… Les autres espaces doivent rester navigables.</p></section>`;if(state.sim==='empty')return header('États UX','Aucun résultat disponible','Cas d’un espace sans historique ou modèle publié.')+`<div class="empty-state"><div style="font-size:36px;color:#87a0b2">▧</div><h2>Aucune décision enregistrée</h2><p>Une version publiée et une exécution autorisée sont nécessaires pour voir une décision vérifiée.</p><button class="btn primary" data-goto="optimization" data-action="normal">Voir les modèles →</button></div>`;if(state.sim==='error')return header('États UX','Connexion temporairement indisponible','Une erreur ne doit pas masquer les informations déjà confirmées ni afficher de valeurs inventées.')+`<div class="alert"><strong>Impossible de récupérer les données</strong>Vérifiez la connexion à l'API sécurisée, puis réessayez. Aucune nouvelle exécution n’a été créée.</div><button class="btn" data-action="normal">↻ Réessayer l'affichage</button>`;if(state.sim==='forbidden')return header('États UX','Action non autorisée','Les permissions sont confirmées par le serveur, pas seulement par le mode d’affichage.')+`<div class="empty-state"><h2>Vous pouvez consulter, mais pas modifier</h2><p>Un droit ou une délégation explicite est nécessaire pour cette action. Contactez un responsable autorisé.</p><button class="btn" data-action="normal">Retour à la consultation</button></div>`;return null;}
 const pages={dashboard,organization,optimization,scenarios,history};
 function render(){document.getElementById('orgsel').value=state.org;document.getElementById('rolesel').value=state.role;document.getElementById('modebtn').textContent='⚙ Mode expert : '+(state.expert?'ON':'OFF');document.getElementById('modebtn').setAttribute('aria-pressed',String(state.expert));document.getElementById('statesel').value=state.sim;for(const b of document.querySelectorAll('[data-page]'))b.classList.toggle('active',b.dataset.page===state.page);elem.innerHTML=(statusOverride()||pages[state.page]())+'<div class="pagefoot">OPTIMIZATION BRAIN · UX CONCEPT V2 · Prototype local autonome · Aucun backend connecté, aucune donnée persistée</div>';document.title=({dashboard:'Tableau de bord',organization:'Mon organisation',optimization:'Optimisation',scenarios:'Scenario Lab',history:'Décisions & historique'})[state.page]+' · Optimization Brain UX V2';}
 document.body.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.disabled)return;if(t.dataset.page||t.dataset.goto){state.page=t.dataset.page||t.dataset.goto;state.sim='normal';window.scrollTo({top:0,behavior:'smooth'});render();return;}if(t.dataset.graph){state.graphView=t.dataset.graph;render();return;}if(t.dataset.node){state.selectedNode=t.dataset.node;render();return;}if(t.dataset.result){state.selectedResult=t.dataset.result;render();return;}if(t.id==='modebtn'){state.expert=!state.expert;render();return;}if(t.dataset.action==='simulate-job'){state.jobState=1;render();return;}if(t.dataset.action==='next-job'){state.jobState=Math.min(3,state.jobState+1);render();return;}if(t.dataset.action==='reset-job'){state.jobState=0;render();return;}if(t.dataset.action==='next-scenario'){if(state.wizard===3 && state.org==='factory' &&(!Number.isInteger(state.scenarioValue)||state.scenarioValue<=0)){alert('Entrez une valeur entière positive pour cette maquette.');return;}state.wizard=Math.min(5,state.wizard+1);render();return;}if(t.dataset.action==='prev-scenario'){state.wizard=Math.max(1,state.wizard-1);render();return;}if(t.dataset.action==='normal'){state.sim='normal';render();return;}});
 document.body.addEventListener('change',e=>{const t=e.target;if(t.id==='orgsel'){state.org=t.value;state.selectedNode=t.value==='factory'?'logistics':'teaching';state.selectedResult=t.value==='factory'?'factory':'univ';state.wizard=1;state.sim='normal';render();}if(t.id==='rolesel'){state.role=t.value;render();}if(t.id==='statesel'){state.sim=t.value;render();}if(t.id==='scenario-input'){state.scenarioValue=Number(t.value);render();}});
 render();
})();
</script>
</body>
</html>
