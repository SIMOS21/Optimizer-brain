name: Python checks
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check brain tests
      - run: python -m ruff format --check brain/kernel tests/test_kernel.py
      - run: python -m mypy
      - run: python -m brain.demo
      - run: python -m brain.kernel verify examples/demo_cross_department.json --plan examples/golden_plan.json
