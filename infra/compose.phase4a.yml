name: optimizerbrain4a
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: brain_migrator
      POSTGRES_PASSWORD: ${BRAIN_MIGRATOR_PASSWORD:?required}
      POSTGRES_DB: optimizer_brain
      BRAIN_APP_PASSWORD: ${BRAIN_APP_PASSWORD:?required}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-platform.sh:/docker-entrypoint-initdb.d/10-platform.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain_migrator -d optimizer_brain"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
